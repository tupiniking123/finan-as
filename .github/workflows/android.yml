name: Build Android APK (Buildozer)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Instala o Android SDK + sdkmanager no runner
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Instala build-tools (contém o AIDL) + platform-tools + platform 33 e aceita licenças
      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          yes | sdkmanager --licenses

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            libffi-dev libssl-dev \
            build-essential cmake

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install buildozer cython==0.29.36

      - name: Build APK (debug)
        env:
          # Faz o buildozer usar o SDK instalado pelo workflow (evita falhas de download do SDK)
          APP_ANDROID_SDK_PATH: ${{ env.ANDROID_HOME }}
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: bin/*.apk
