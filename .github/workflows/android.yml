name: Build Android APK (Buildozer)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ FIX: garantir que exista cmdline-tools/latest e tools/bin/sdkmanager
      - name: Fix sdkmanager path for Buildozer
        run: |
          set -eux
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools" || true

          # Se não existir "latest", cria apontando para a pasta existente (ex: 16.0)
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            TOOL_DIR=$(ls -1 "$ANDROID_HOME/cmdline-tools" | head -n 1)
            ln -s "$ANDROID_HOME/cmdline-tools/$TOOL_DIR" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          # Cria o caminho antigo que o buildozer às vezes tenta usar:
          sudo mkdir -p "$ANDROID_HOME/tools/bin"
          sudo ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          sudo ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager"

          "$ANDROID_HOME/tools/bin/sdkmanager" --version

      - name: Install Android packages (platform-tools / build-tools / platform)
        run: |
          set -eux
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses
          "$ANDROID_HOME/tools/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            libffi-dev libssl-dev \
            build-essential cmake

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install buildozer cython==0.29.36

      - name: Build APK (debug)
        env:
          APP_ANDROID_SDK_PATH: ${{ env.ANDROID_HOME }}
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: bin/*.apk
